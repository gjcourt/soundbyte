name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag
        id: meta
        run: |
          # Date-stamped tag matches the rest of gjcourt/* images
          # (e.g. ghcr.io/gjcourt/soundbyte:2026-05-02) and the scheme the
          # Makefile / scripts/build_and_push_image.sh already use. A date+sha
          # tag is also published for a unique, immutable reference.
          DATE=$(date -u +%Y-%m-%d)
          SHA=${GITHUB_SHA::7}
          REPO=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "tag=$DATE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$DATE-$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Server image (Dockerfile) — multi-arch, CGO-free cross build.
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
          provenance: false

      # Client image (Dockerfile.client) — needs CGO/ALSA, so amd64 only.
      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}-client:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repo }}-client:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.repo }}-client:latest
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          provenance: false
